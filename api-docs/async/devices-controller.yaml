asyncapi: 3.0.0
info:
  title: Асинхронное API сервиса "Управление приборами"
  version: 0.0.1
  description: |
    Описание асинхронного взаимодействия между сервисами "Управление приборами"
    и "Телеметрия приборов". Сервис "Управление приборами" является источником
    событий, сервис "Телеметрия приборов" является потребителем и обраотчиком
    событий телеметрии.

operations:
  deviceStateChanged:
    action: send
    channel:
      $ref: 'common.yaml#/channels/deviceState'
