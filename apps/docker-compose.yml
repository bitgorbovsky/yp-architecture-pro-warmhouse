version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_PASSWORD: iot
      POSTGRES_USER: iot
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d smarthome -U iot" ]
      interval: 10s
      timeout: 1m
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - smarthome-network
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    networks:
      - smarthome-network

  sqitch:
    image: sqitch/sqitch:latest
    networks:
      - smarthome-network
    environment:
      - PGPASSWORD=iot
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./devices-registry/migrations:/repo
    command:
      - deploy
      - db:pg://iot@postgres:5432/devices_registry

  devices-registry:
    build:
      context: ./devices-registry
      dockerfile: Dockerfile
    container_name: devices-resgistry
    networks:
      - smarthome-network
    environment:
      - DB_HOST=postgres
      - DB_USER=iot
      - DB_NAME=devices_registry
      - DB_PASS=iot
      - HTTP_PORT=8081
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sqitch:
        condition: service_completed_successfully
    ports:
      - "8081:8081"

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://iot:iot@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
